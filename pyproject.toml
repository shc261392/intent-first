[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "intent-first"
dynamic = ["version"]
description = "Intent → Spec → Plan → Execution → Artifacts: a lightweight, pluggable approval protocol for coding agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []
keywords = ["ai", "agents", "agent-skills", "claude-code", "copilot", "cursor", "codex", "opencode", "hooks"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/shc261392/intent-first"
Issues = "https://github.com/shc261392/intent-first/issues"

[project.scripts]
intent-first = "intent_first.cli:main"

[tool.setuptools.dynamic]
version = { attr = "intent_first.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
intent_first = ["assets/*", "assets/**/*"]

[tool.ruff]
target-version = "py39"
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]

[tool.ruff.lint.isort]
known-first-party = ["intent_first", "helpers"]
