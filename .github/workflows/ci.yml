name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check src tests scripts
      - run: shellcheck install.sh

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Build zipapp, sdist and wheel
        run: |
          python3 scripts/build_pyz.py
          uv build
      - name: Smoke test the zipapp in a fresh repo
        run: |
          cd "$(mktemp -d)" && git init -q
          python3 "$GITHUB_WORKSPACE/dist/intent-first.pyz" init --tools all
          python3 "$GITHUB_WORKSPACE/dist/intent-first.pyz" new demo
          python3 "$GITHUB_WORKSPACE/dist/intent-first.pyz" doctor
          python3 "$GITHUB_WORKSPACE/dist/intent-first.pyz" uninstall --yes --purge
          test -z "$(ls -A | grep -v '^.git$')"
      - name: Smoke test the wheel via uvx
        run: uvx --from dist/*.whl intent-first --version
